name: Publish on NPM
on:
  workflow_run:
    workflows: ['Tests']
    types: [completed]
    branches: [main]

permissions:
  id-token: write # Required for OIDC
  contents: write # push the release tag

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: 'https://registry.npmjs.org'

      - run: npm --version
      - run: npm install

      - name: Determine publish tag
        id: publish_tag
        run: npx tsx .github/scripts/publish-tag.ts

      - if: steps.publish_tag.outputs.changed == 'true'
        run: npm test
      - if: steps.publish_tag.outputs.changed == 'true'
        run: npm publish --tag ${{ steps.publish_tag.outputs.tag }}

      # create-frappe-ui has the same version as frappe-ui, and the Tests
      # workflow fails when they differ. The docs say `npm create
      # frappe-ui@latest`, so until a stable create-frappe-ui is out, every
      # release takes `latest`, even while frappe-ui's own `latest` is 0.x.
      # After that, both packages use the same tag.
      - name: Publish create-frappe-ui
        if: steps.publish_tag.outputs.changed == 'true'
        working-directory: packages/create-frappe-ui
        env:
          TAG: ${{ steps.publish_tag.outputs.tag }}
        run: |
          current=$(npm view create-frappe-ui dist-tags.latest 2>/dev/null || true)
          if [ "$TAG" != latest ] && { [ -z "$current" ] || [[ "$current" == *-* ]]; }; then
            TAG=latest
          fi
          npm publish --tag "$TAG"

      # Tag the exact commit that was published (head_sha checked out above).
      # Idempotent: skips if the tag already exists, so workflow re-runs are safe.
      - name: Tag the release
        if: steps.publish_tag.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.publish_tag.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
