name: Verify changesets

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  verify:
    # Skips only the release PR, which deletes the changesets it applies. A fork
    # branch with the same name does not match. The author is not checked: the
    # barista app opens the release PR, so it is not github-actions[bot].
    if: >-
      ${{ !(github.head_ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      # Checks out the merge commit, so HEAD^1 is the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Verify changesets
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/verify-changesets.ts
