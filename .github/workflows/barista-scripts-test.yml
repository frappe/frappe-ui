name: Barista — Scripts Test

on:
  pull_request:
    paths:
      - '.github/barista/scripts/**'
      - '.github/workflows/barista-scripts-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run tests
        run: bun test ./.github/barista/scripts
