<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <!-- No icon yet, so the browser doesn't request /favicon.ico. Add yours here. -->
    <link rel="icon" href="data:," />
    <script>
      // Apply the saved light or dark mode before the first paint, so the page
      // doesn't flash. useColorScheme() in the app keeps it in sync after that.
      const scheme = localStorage.getItem('theme')
      const dark =
        scheme === 'dark' ||
        (scheme !== 'light' &&
          matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
